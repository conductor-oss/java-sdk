plugins {
    id 'java'
    id 'application'
}

application {
    // Override with -PharnessMain=<fqcn>, e.g. io.orkes.conductor.harness.ControllerOverheadMain
    mainClass = providers.gradleProperty('harnessMain').getOrElse('io.orkes.conductor.harness.HarnessMain')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':conductor-client')
    implementation project(':conductor-client-metrics')
    implementation "ch.qos.logback:logback-classic:1.5.6"
}
