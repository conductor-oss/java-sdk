# Conductor OSS stack used to run the SDK integration tests against open-source Conductor.
# Shared by scripts/run-integration-oss.sh and the integration-tests-oss job in
# .github/workflows/integration-tests.yml.
#
# OSS_CONDUCTOR_VERSION defaults to `latest` for local runs. CI resolves it from the
# E2E_TEST_OSS_CONDUCTOR_VERSION org variable (or a workflow_dispatch input); that variable is
# currently set to `latest` too, so CI tracks whatever `latest` resolves to at run time rather
# than a fixed version. Set the org variable to a real tag if the job needs to be deterministic.

services:
  conductor-server:
    image: conductoross/conductor:${OSS_CONDUCTOR_VERSION:-latest}
    environment:
      - CONFIG_PROP=config-postgres.properties
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
    links:
      - conductor-postgres:postgresdb
    depends_on:
      conductor-postgres:
        condition: service_healthy

  conductor-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
