# Conductor OSS stack used to run the SDK integration tests against open-source Conductor.
# Shared by scripts/run-integration-oss.sh and the integration-tests-oss job in
# .github/workflows/integration-tests-oss.yml.
#
# The `image:` default below is the SINGLE place the Conductor OSS image tag is written.
# Everything that does not override OSS_CONDUCTOR_VERSION lands on it: a plain
# scripts/run-integration-oss.sh run, and the integration-tests-oss job on a fork PR (where
# GitHub withholds org variables). Overrides are the script's --version flag and, in CI, the
# E2E_TEST_OSS_CONDUCTOR_VERSION org variable or a workflow_dispatch input. Bump the tag here
# and both follow.
#
# The org variable is set independently of this default, so a normal CI run can be on a
# different tag than a local run. The "Pull Conductor OSS image" CI step prints the tag in use.

services:
  conductor-server:
    image: conductoross/conductor:${OSS_CONDUCTOR_VERSION:-3.34.0}
    environment:
      - CONFIG_PROP=config-postgres.properties
    ports:
      - "8080:8080"
    healthcheck:
      # Images up to 3.34.0-rc2 ship curl but not wget; from rc3 on they ship busybox wget but not
      # curl. Try both so the status is right on any tag. 127.0.0.1 for wget: busybox wget tries
      # ::1 first and does not fall back to the IPv4-bound server.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || curl -sf http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
    links:
      - conductor-postgres:postgresdb
    depends_on:
      conductor-postgres:
        condition: service_healthy

  conductor-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
