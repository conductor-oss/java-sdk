plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'signing'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'groovy'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

ext {
    artifactName = 'Conductor Client'
    artifactDescription = 'Conductor OSS client (http)'
}

apply plugin: 'publish-config'

configurations {
    // compiled and tested against, shipped inside the jar, never listed in the POM
    bundled
    compileOnly.extendsFrom bundled
    testImplementation.extendsFrom bundled
}

dependencies {
    api "com.squareup.okhttp3:okhttp:${versions.okHttp}"

    // Bundled into the jar under org.conductoross.conductor.shaded (see bundledJar below), so they
    // are not dependencies of the published artifact and cannot clash with an application's own.
    // ASM reads compiled workflow code to draw untaken branches and definitions; ByteBuddy
    // generates the task stubs a workflow's task calls go through.
    bundled 'org.ow2.asm:asm:9.9'
    bundled 'org.ow2.asm:asm-tree:9.9'
    bundled 'org.ow2.asm:asm-analysis:9.9'
    bundled 'net.bytebuddy:byte-buddy:1.18.3'

    // test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter-api:${versions.junit}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${versions.junit}"

    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation "com.squareup.okhttp3:mockwebserver:${versions.okHttp}"
    testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'
    testImplementation 'org.codehaus.groovy:groovy:3.0.25'
    testImplementation 'ch.qos.logback:logback-classic:1.5.32'
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${versions.jackson}"
}

java {
    withSourcesJar()
    withJavadocJar()
}

test {
    useJUnitPlatform()
    maxParallelForks = 1
}

def relocateBundled = { task ->
    task.relocate 'net.bytebuddy', 'org.conductoross.conductor.shaded.bytebuddy'
    task.relocate 'org.objectweb.asm', 'org.conductoross.conductor.shaded.asm'
    task.exclude 'module-info.class', 'META-INF/versions/*/module-info.class'
    // ByteBuddy is a multi-release jar: keep its Java 9 and Java 24 classes in use
    task.manifest { attributes 'Multi-Release': 'true' }
}

shadowJar {
    archiveFileName = "conductor-client-$version-all.jar"
    configurations = [project.configurations.runtimeClasspath, project.configurations.bundled]
    mergeServiceFiles()
    relocateBundled(it)
}

// The module's jar: its classes plus the bundled libraries, relocated. It replaces the plain jar
// for everything that uses this module, the published artifact and the other modules here alike.
def bundledJar = tasks.register('bundledJar', ShadowJar) {
    from sourceSets.main.output
    configurations = [project.configurations.bundled]
    archiveClassifier = ''
    mergeServiceFiles()
    relocateBundled(it)
}

jar {
    archiveClassifier = 'plain'
}

['apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        outgoing.artifacts.clear()
        outgoing.artifact(bundledJar)
    }
}

tasks.build {
    dependsOn shadowJar
}
