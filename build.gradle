plugins {
    id 'com.diffplug.spotless' version '6.+'
}

group = 'io.orkes.conductor'

apply from: "$rootDir/versions.gradle"

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'
    group = 'org.conductoross'

    spotless {
        java {
            removeUnusedImports()
            importOrder('java', 'javax', 'org', 'com.netflix', 'io.orkes', '', '\\#com.netflix', '\\#')
            licenseHeaderFile("$rootDir/licenseheader.txt")
        }
    }

    jacoco {
        toolVersion = "0.8.11"
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
        
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    '**/generated/**',
                    '**/model/**',
                    '**/test/**'
                ])
            }))
        }
    }

    test {
        jacoco {
            excludes = ['**/generated/**']
        }
        finalizedBy jacocoTestReport
    }

    compileJava {
        sourceCompatibility = 21
        targetCompatibility = 21
    }

    dependencies {
        // ### candidates to be shadowed ###
        implementation "com.google.guava:guava:${versions.guava}"
        // #################################

        // Jackson 3 (tools.jackson) -- versions managed by the Jackson 3 BOM, mirroring
        // the server's Spring Boot BOM resolution (conductor-oss/conductor#1573). The jdk8
        // and java.time datatypes and the afterburner property-access optimisation are all
        // built into core now, so those modules are gone. Annotations stay on the 2.x line
        // (com.fasterxml.jackson.annotation) per JSTEP-1 -- the BOM pins the right 2.x build.
        implementation platform("tools.jackson:jackson-bom:${versions.jacksonBom}")
        implementation "tools.jackson.core:jackson-databind"
        implementation "tools.jackson.core:jackson-core"
        implementation "com.fasterxml.jackson.core:jackson-annotations"
        implementation "tools.jackson.module:jackson-module-kotlin"
        implementation "org.openjdk.nashorn:nashorn-core:15.6"

        implementation "org.slf4j:slf4j-api:${versions.slf4j}"
        implementation "org.apache.commons:commons-lang3:${versions.commonsLang}"
        annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
        compileOnly "org.projectlombok:lombok:${versions.lombok}"
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url "https://s01.oss.sonatype.org/content/repositories/releases/"
        }
    }

    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

}
