plugins {
    id 'com.diffplug.spotless' version '6.+'
}

group = 'io.orkes.conductor'

apply from: "$rootDir/versions.gradle"

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'
    group = 'org.conductoross'

    spotless {
        java {
            removeUnusedImports()
            importOrder('java', 'javax', 'org', 'com.netflix', 'io.orkes', '', '\\#com.netflix', '\\#')
            licenseHeaderFile("$rootDir/licenseheader.txt")
        }
    }

    jacoco {
        toolVersion = "0.8.11"
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
        
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    '**/generated/**',
                    '**/model/**',
                    '**/test/**'
                ])
            }))
        }
    }

    test {
        jacoco {
            excludes = ['**/generated/**']
        }
        finalizedBy jacocoTestReport
    }

    compileJava {
        sourceCompatibility = 21
        targetCompatibility = 21
    }

    dependencies {
        // ### candidates to be shadowed ###
        implementation "com.google.guava:guava:${versions.guava}"
        // #################################

        implementation "com.fasterxml.jackson.core:jackson-databind:${versions.jackson}"
        implementation "com.fasterxml.jackson.core:jackson-core:${versions.jackson}"
        implementation "com.fasterxml.jackson.core:jackson-annotations:${versions.jackson}"
        implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${versions.jackson}"
        implementation "com.fasterxml.jackson.module:jackson-module-kotlin:${versions.jackson}"
        implementation "com.fasterxml.jackson.module:jackson-module-afterburner:${versions.jackson}"
        implementation "org.openjdk.nashorn:nashorn-core:15.6"

        implementation "org.slf4j:slf4j-api:${versions.slf4j}"
        implementation "org.apache.commons:commons-lang3:${versions.commonsLang}"
        annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
        compileOnly "org.projectlombok:lombok:${versions.lombok}"
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url "https://s01.oss.sonatype.org/content/repositories/releases/"
        }
    }

    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

}

// CVE scan coverage: lock the runtime classpath of the published client libraries
// so the dependency scanner sees pinned, resolved transitive versions (committed
// gradle.lockfile per module). Only runtimeClasspath is locked -- that is what
// actually ships; test and compile-only configs are left unlocked.
def publishedProjects = [
    'conductor-client', 'conductor-client-ai', 'conductor-client-metrics',
    'conductor-client-spring', 'conductor-client-ai-spring', 'conductor-client-spring-boot4',
]
configure(subprojects.findAll { it.name in publishedProjects }) {
    configurations.matching { it.name == 'runtimeClasspath' }.configureEach {
        resolutionStrategy.activateDependencyLocking()
    }
}

// Promote staged artifacts to Maven Central -- ONCE for the whole build.
//
// Every published module uploads into the single shared staging repository
// (`org.conductoross--default-repository`), so promotion has to happen exactly
// once, after all of them have uploaded. This task used to be created by
// PublishConfigPlugin in each module and `finalizedBy` that module's `publish`,
// which promoted the shared repository once per module: 6 Central deployments
// per release, each counting against the org's monthly release quota, and all
// but the last running before the remaining modules had uploaded. Conductor had
// the same bug (conductor-oss/conductor#1826).
//
// Run it after `publish` in the same invocation:
//     ./gradlew publish promoteToMavenCentral -PmavenCentral ...
// `mustRunAfter` makes it execute last, once every upload is staged.
tasks.register('promoteToMavenCentral') {
    group = 'publishing'
    description = 'Promotes staged artifacts to Maven Central (once for the whole build)'

    mustRunAfter(subprojects.collect { sp -> sp.tasks.matching { it.name == 'publish' } })

    onlyIf {
        project.hasProperty('mavenCentral') &&
                project.hasProperty('username') &&
                project.hasProperty('password') &&
                !project.version.toString().endsWith('-SNAPSHOT')
    }

    doLast {
        def username = project.properties['username']
        def password = project.properties['password']

        // Create base64 encoded token for authentication
        def token = "${username}:${password}".bytes.encodeBase64().toString()

        // Get open staging repositories
        def response = new URL("https://ossrh-staging-api.central.sonatype.com/manual/search/repositories")
                .openConnection()
        response.setRequestProperty("Authorization", "Basic ${token}")
        response.setRequestProperty("Content-Type", "application/json")

        def repositories = new groovy.json.JsonSlurper().parse(response.inputStream)

        def openRepositories = repositories.repositories.findAll { it.state == "open" }
        if (openRepositories.isEmpty()) {
            project.logger.lifecycle("No open staging repositories to promote.")
            return
        }

        // A normal release has exactly one (the shared default repository); iterating
        // also promotes any left open by an earlier failed run.
        openRepositories.each { repo ->
            project.logger.lifecycle("Promoting repository ${repo.key}")

            def promoteUrl = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/${repo.key}?publishing_type=automatic")
            def connection = promoteUrl.openConnection()
            connection.setRequestMethod("POST")
            connection.setRequestProperty("Authorization", "Basic ${token}")
            connection.setRequestProperty("Content-Type", "application/json")

            def responseCode = connection.responseCode
            if (responseCode == 200) {
                project.logger.lifecycle("Successfully promoted repository ${repo.key}")
            } else {
                def errorMessage = "Failed to promote repository ${repo.key}. Response code: ${responseCode}. Response: ${connection.responseMessage}"
                project.logger.error(errorMessage)
                throw new GradleException(errorMessage)
            }
        }
    }
}
