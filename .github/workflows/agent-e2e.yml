name: Agent E2E

# Runs the agent e2e suites (e2e/) against the Conductor OSS
# server boot JAR (Maven Central) — the server this SDK ships against, with
# the agent runtime on by default from 3.32.0-rc.8 onward. A separate agent
# server JAR is no longer used here.
#
# These tests call real LLMs via the OPENAI_API_KEY / ANTHROPIC_API_KEY
# repo secrets. The suites themselves never read the keys (asserted by
# Suite2ToolCallingCredentials) — only the server process gets them.
# Fork PRs cannot see repo secrets, so for them the run fails at the
# silently-empty guard rather than passing vacuously.

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: agent-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tracks the org-level E2E_TEST_OSS_CONDUCTOR_VERSION, set by conductor's
  # publish.yml on each release (shared with the pull_request.yml docker e2e).
  # Fork PRs can't read org vars, so they fall back to the pinned default.
  CONDUCTOR_SERVER_VERSION: ${{ vars.E2E_TEST_OSS_CONDUCTOR_VERSION || '3.33.0' }}

jobs:
  agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONDUCTOR_SERVER_URL: http://localhost:8080/api
      # Default model for every suite. The Orkes-Developers OpenAI project only
      # allows the gpt-5.6 / gpt-6 families; gpt-6-luna is OpenAI's replacement
      # for gpt-4o-mini, which shuts down on 2027-01-14.
      CONDUCTOR_AGENT_LLM_MODEL: openai/gpt-6-luna
    steps:
      # A dead key, exhausted quota, retired model or provider outage makes
      # every agent test wait out its timeout — the job then hits timeout-minutes
      # before the runner reports a single failure. Call the model the suites use
      # directly, before any setup: the HTTP status and body name the cause in
      # seconds. No suite calls Anthropic through the server, so only OpenAI is
      # checked.
      - name: LLM provider check
        timeout-minutes: 1
        run: |
          fail=0
          probe() {  # label, url, curl args...
            local label=$1 url=$2; shift 2
            local code
            code=$(curl -sS -m 15 -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' "$url" "$@" \
              -H 'content-type: application/json') || true
            echo "$label: HTTP $code"
            if [ "$code" != 200 ]; then
              echo "::error::$label check failed (HTTP $code; 000 = no response in 15s)"
              cat "$RUNNER_TEMP/probe.json" 2>/dev/null || true; echo
              fail=1
            fi
          }
          # Responses API, as the server uses; 16 is its minimum max_output_tokens.
          openai_model=${CONDUCTOR_AGENT_LLM_MODEL#openai/}
          probe "OpenAI $openai_model" https://api.openai.com/v1/responses \
            -H "authorization: Bearer $OPENAI_API_KEY" \
            -d "{\"model\":\"$openai_model\",\"input\":\"ping\",\"max_output_tokens\":16,\"reasoning\":{\"effort\":\"none\"}}"
          exit $fail

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Python is only needed for mcp-testkit and the XML guard.
      # No `cache: pip` — it hard-fails without a requirements file.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache server JAR
        id: jar_cache
        uses: actions/cache@v4
        with:
          path: conductor-server.jar
          key: conductor-oss-server-${{ env.CONDUCTOR_SERVER_VERSION }}

      - name: Download server JAR from Maven Central
        if: steps.jar_cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o conductor-server.jar \
            "https://repo1.maven.org/maven2/org/conductoross/conductor-server/${CONDUCTOR_SERVER_VERSION}/conductor-server-${CONDUCTOR_SERVER_VERSION}-boot.jar"

      - name: Install mcp-testkit
        run: |
          python -m pip install --upgrade pip
          pip install mcp-testkit

      - name: Start mcp-testkit
        run: |
          mcp-testkit --transport http --port 3001 &
          sleep 2

      - name: Start server
        run: |
          java -jar conductor-server.jar --server.port=8080 > server.log 2>&1 &

      - name: Wait for server health
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health | grep -q '"healthy"[[:space:]]*:[[:space:]]*true'; then
              echo "server healthy after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::server failed to become healthy within 90s"
          tail -100 server.log
          exit 1

      - name: Run e2e suites
        run: ./gradlew :e2e:test -Pe2e

      # The uploaded server.log is lost when the run is re-run, and a run
      # killed at timeout-minutes never reports its test failures — keep the
      # server's own errors in the job log, which survives both.
      - name: Show server errors
        if: failure() || cancelled()
        run: |
          [ -f server.log ] || exit 0
          grep -nE ' (ERROR|WARN) |Exception|[Qq]uota|rate.?limit|\b(401|403|404|429)\b' server.log \
            | grep -vE 'cannot init (Cohere|Mistral)' | tail -150

      # BaseTest assumeTrue-skips every suite when the server is unreachable —
      # without this guard a boot failure after the health gate (or a future
      # gate regression) would yield a green job that ran nothing.
      - name: Guard against silently-empty runs
        if: always()
        run: |
          python - <<'EOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          total = executed = 0
          for path in glob.glob("e2e/build/test-results/test/TEST-*.xml"):
              root = ET.parse(path).getroot()
              t = int(root.get("tests", 0))
              sk = int(root.get("skipped", 0))
              total += t
              executed += t - sk
          print(f"executed {executed}/{total} tests")
          sys.exit(0 if executed > 0 else 1)
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-results
          path: |
            e2e/build/test-results/test/
            e2e/build/reports/tests/test/
            server.log
          retention-days: 14
