name: Java Client Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-validation:
    runs-on: ubuntu-latest
    name: README validation
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Validate README links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md

      - name: Reject retired README references
        run: |
          if rg -n ':examples:run|examples/old|LlmIndexDocument|\.topK\(' README.md; then
            echo "README references a retired command, path, or API."
            exit 1
          fi

      - name: Compile documented AI example target
        run: ./gradlew :agent-examples:compileJava

      - name: Package documented core example
        run: |
          docker run --rm \
            -v "$PWD/examples/basics/hello-world":/work \
            -v "$HOME/.m2":/root/.m2 \
            -w /work \
            maven:3.9-eclipse-temurin-21 \
            mvn -B package -DskipTests

      - name: Smoke-test documented core quickstart
        working-directory: examples/basics/hello-world
        env:
          CONDUCTOR_PORT: 18080
          CONDUCTOR_UI_PORT: 11234
        run: |
          timeout 240 ./run.sh
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:18080/health
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:11234/
          docker compose ps --status running --services | rg --fixed-strings --line-regexp conductor

      - name: Stop documented core quickstart
        if: always()
        working-directory: examples/basics/hello-world
        run: docker compose down -v --remove-orphans

  build:
    runs-on: ubuntu-latest
    name: Java Client Build
    env:
      CONDUCTOR_SERVER_URL: ${{ vars.SERVER_URL }}
      CONDUCTOR_AUTH_KEY: ${{ secrets.AUTH_KEY }}
      CONDUCTOR_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
          
      - name: Build
        id: build
        run: ./gradlew clean build -x test
        
      - name: Run Tests
        id: tests
        if: success()
        continue-on-error: true
        run: ./gradlew test jacocoTestReport
        
      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/build/reports/jacoco/test/jacocoTestReport.xml'
        
      - name: Check Tests Status
        if: steps.tests.outcome == 'failure'
        run: exit 1
