            archaius      : '0.7.12',
            slf4j         : '1.7.36',
            log4j         : '2.25.4',
            lombok        : '1.18.30',
            commonsLang   : '3.19.0',
            junit         : '5.10.3',
            awaitility    : '4.2.0',
            wiremock      : '2.33.2',
            mockito       : '5.12.0',
            testContainers: '1.19.8',
            revGroovy     : '4.0.9',
            revSpock      : '2.4-M1-groovy-4.0',
            langchain4j   : '1.0.0',
            googleAdk     : '1.3.0',
            langgraph4j   : '1.6.0-beta5'
    ]
}